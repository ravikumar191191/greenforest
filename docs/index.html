:root{color-scheme:dark;--tube:#030604;--phosphor:#8dff9f;}
html,body{margin:0;padding:0;height:100%;background:var(--tube);overflow:hidden;overscroll-behavior:none;}
body{position:fixed;inset:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:'Share Tech Mono','SF Mono',Menlo,Consolas,monospace;color:var(--phosphor);}
#tube{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--tube);outline:none;}
#tube:focus-visible{box-shadow:inset 0 0 0 2px var(--phosphor);}
#sa{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);}
#nojs{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:var(--tube);}
</style>
</head>
<body>
<canvas id="tube" tabindex="0" aria-label="Rat Hunter: Night Vision Sniper. Drag to aim, tap FIRE to shoot."></canvas>
<div id="sa" aria-hidden="true"></div>
<noscript><div id="nojs">Rat Hunter needs JavaScript to run.</div></noscript>
<script>
(() => {
'use strict';

/* ============================================================
   RAT HUNTER: NIGHT VISION SNIPER
   A one-file canvas game. Everything you might want to tune
   lives in CFG and PALETTES right here at the top.
   ============================================================ */

const CFG = {
  worldW: 2600,        // world units, left edge to right edge of the barn
  worldH: 2300,        // world units, rafters (0) down to the floor at your feet
  wallBaseY: 900,      // where the back wall meets the floor
  floorBand: 500,      // how far out from the wall the rats roam (world units)
  viewW: 800,          // world units visible across the screen at 1x zoom
  magSize: 5,          // rounds in the magazine
  ammoPerRat: 3,       // rounds issued per rat at the start of each round
  reloadTime: 1.5,     // seconds
  boltTime: 0.42,      // seconds between shots (bolt cycle)
  sacks: 3,            // lives: grain sacks the rats can steal
  ratBaseSpeed: 170,   // world units per second in round 1
  ratLength: 72,       // world units, nose to rump
  roundIntro: 2.2,     // seconds the round banner stays up
  roundClear: 2.8,     // seconds the round summary stays up
};

// Every palette is a 7-step luminance ramp (tube black -> bloom white) plus a reticle
// colour that contrasts with it. White phosphor is the look of the original clip.
const PALETTES = {
  white:   { key:'white',   label:'WHITE PHOSPHOR', ramp:['#050607','#1a1d1f','#3f4346','#71767a','#a5abaf','#d6dadc','#ffffff'], reticle:'#3dff62', warn:'#ffc257' },
  digital: { key:'digital', label:'DIGITAL',        ramp:['#03070a','#0b1c26','#174050','#2a6a7e','#4fa3b5','#95d8e3','#eafcff'], reticle:'#ff6a4d', warn:'#ffc257' },
  amber:   { key:'amber',   label:'AMBER',          ramp:['#060402','#2a1a06','#5c3a0c','#9a6414','#d99a2b','#ffd071','#fff5d6'], reticle:'#fff9e8', warn:'#ff6a4d' },
  thermal: { key:'thermal', label:'THERMAL',        ramp:['#06020c','#24094a','#6a1470','#b8235f','#f06a2a','#fbc531','#ffffff'], reticle:'#ffffff', warn:'#7ff0ff' },
  green:   { key:'green',   label:'P43 GREEN',      ramp:['#030604','#0a2411','#175c2a','#2c9a48','#5fd97a','#a4ffb5','#eaffee'], reticle:'#dcffe3', warn:'#ffc257' },
};
const PALETTE_ORDER = ['white', 'digital', 'amber', 'thermal', 'green'];
const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

const FONT_DISPLAY = "'VT323','SF Mono',Menlo,Consolas,monospace";
const FONT_UI = "'Share Tech Mono','SF Mono',Menlo,Consolas,monospace";

// ---------- small helpers ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const pad = (n, w) => String(Math.max(0, Math.floor(n))).padStart(w, '0');
const hexToRgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const TAU = Math.PI * 2;

// Seeded random for the static scene, so straw and boards look the same every visit.
function mulberry(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

// ---------- persistence (best-effort; private mode may throw) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ignore */ } },
};
const savedOpt = store.get('rh.opt', {});
if (!(savedOpt.v >= 2)) delete savedOpt.palette;   // v1 saves defaulted to green; let the new default win once
if (!(savedOpt.v >= 3)) delete savedOpt.tapFire;   // v2 saves defaulted tap-to-fire off; now it is on
const OPT = Object.assign({ v: 3, palette: 'white', sound: true, leftHand: false, tapFire: true, aim: 1 }, savedOpt);
function saveOpt() { store.set('rh.opt', OPT); }

// ---------- palette ----------
function makePal(key) {
  const p = PALETTES[key] || PALETTES.white;
  const rgb = p.ramp.map(hexToRgb);
  return Object.assign({}, p, { rgb, a: (i, al) => `rgba(${rgb[i][0]},${rgb[i][1]},${rgb[i][2]},${al})` });
}
let PAL = makePal(OPT.palette);
function setPalette(key) {
  PAL = makePal(key);
  OPT.palette = PAL.key;
  document.documentElement.style.setProperty('--tube', PAL.ramp[0]);
  document.documentElement.style.setProperty('--phosphor', PAL.ramp[4]);
  onPaletteChange();
}
const paletteListeners = [];
function onPaletteChange() { for (const f of paletteListeners) f(); }

// ---------- canvas & viewport ----------
const canvas = document.getElementById('tube');
const ctx = canvas.getContext('2d', { alpha: false });
const saProbe = document.getElementById('sa');
let W = 0, H = 0, DPR = 1;
const SAFE = { t: 0, b: 0, l: 0, r: 0 };
const resizeListeners = [];
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth) || window.innerWidth;
  H = Math.round(vv ? vv.height : window.innerHeight) || window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  const cs = getComputedStyle(saProbe);
  SAFE.t = parseFloat(cs.paddingTop) || 0; SAFE.b = parseFloat(cs.paddingBottom) || 0;
  SAFE.l = parseFloat(cs.paddingLeft) || 0; SAFE.r = parseFloat(cs.paddingRight) || 0;
  for (const f of resizeListeners) f();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 50));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

// ---------- camera ----------
const cam = { x: CFG.worldW / 2, y: 1010, zoom: 1, zoomT: 1 };
const kick = { x: 0, y: 0 };   // recoil offset
const sway = { x: 0, y: 0 };   // breathing
const baseScale = () => Math.max(W / CFG.viewW, H / CFG.worldH);
const viewScale = () => baseScale() * cam.zoom;
function clampCam() {
  const s = viewScale();
  const hw = W / (2 * s), hh = H / (2 * s);
  cam.x = clamp(cam.x, hw, CFG.worldW - hw);
  cam.y = clamp(cam.y, hh, CFG.worldH - hh);
}
function worldToScreen(x, y) {
  const s = viewScale();
  return [(x - cam.x - kick.x - sway.x) * s + W / 2, (y - cam.y - kick.y - sway.y) * s + H / 2];
}
function screenToWorld(sx, sy) {
  const s = viewScale();
  return [(sx - W / 2) / s + cam.x + kick.x + sway.x, (sy - H / 2) / s + cam.y + kick.y + sway.y];
}

// ---------- haptics bridge (only does something inside the iOS wrapper) ----------
function haptic(kind) {
  try { const h = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.haptic; if (h) h.postMessage(kind); } catch (e) { /* not in the app */ }
}

// ---------- audio: everything is synthesized, no files ----------
const Audio = (() => {
  let ac = null, master = null, echo = null, noiseBuffer = null;
  function init() {
    if (ac) return true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ac = new AC();
      master = ac.createGain(); master.gain.value = OPT.sound ? 0.8 : 0; master.connect(ac.destination);
      // a short barn slapback so gunshots have a room
      echo = ac.createDelay(0.5); echo.delayTime.value = 0.17;
      const fb = ac.createGain(); fb.gain.value = 0.28;
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400;
      echo.connect(lp); lp.connect(fb); fb.connect(echo); fb.connect(master);
      const n = Math.floor(ac.sampleRate * 0.6);
      noiseBuffer = ac.createBuffer(1, n, ac.sampleRate);
      const d = noiseBuffer.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      return true;
    } catch (e) { ac = null; return false; }
  }
  function unlock() { if (!init()) return; if (ac.state === 'suspended') ac.resume().catch(() => {}); }
  function ok() { return ac && ac.state === 'running'; }
  function noise(dur, o) {
    if (!ok()) return;
    o = o || {};
    const t = ac.currentTime + (o.at || 0);
    const src = ac.createBufferSource(); src.buffer = noiseBuffer;
    const f = ac.createBiquadFilter(); f.type = o.type || 'lowpass'; f.Q.value = o.q || 0.8;
    f.frequency.setValueAtTime(o.f0 || 3000, t);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.gain || 0.5, t + (o.attack || 0.003));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(master);
    if (o.echo) g.connect(echo);
    src.start(t); src.stop(t + dur + 0.05);
  }
  function tone(freq, dur, o) {
    if (!ok()) return;
    o = o || {};
    const t = ac.currentTime + (o.at || 0);
    const osc = ac.createOscillator(); osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (o.f1) osc.frequency.exponentialRampToValueAtTime(o.f1, t + dur);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t + dur * 1.6);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.gain || 0.2, t + (o.attack || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(master);
    osc.start(t); osc.stop(t + dur + 0.05);
  }
  const sfx = {
    shot() {
      noise(0.32, { gain: 0.9, f0: 5000, f1: 200, q: 0.6, echo: true });
      tone(90, 0.28, { gain: 0.5, f1: 35 });
      noise(0.08, { gain: 0.4, f0: 8000, type: 'highpass' });
    },
    bolt() { noise(0.03, { gain: 0.25, f0: 2500, type: 'highpass' }); noise(0.04, { gain: 0.3, f0: 1800, type: 'bandpass', q: 2, at: 0.11 }); },
    reload() {
      noise(0.03, { gain: 0.3, f0: 3000, type: 'highpass' });
      noise(0.16, { gain: 0.12, f0: 900, f1: 500, type: 'bandpass', q: 1.5, at: 0.25 });
      noise(0.04, { gain: 0.35, f0: 2200, type: 'bandpass', q: 3, at: 1.25 });
    },
    empty() { noise(0.025, { gain: 0.3, f0: 4000, type: 'highpass' }); },
    hit() { tone(1900, 0.09, { gain: 0.16, f1: 2800, type: 'triangle' }); tone(2600, 0.12, { gain: 0.12, f1: 900, type: 'triangle', at: 0.09 }); noise(0.09, { gain: 0.35, f0: 600, f1: 150 }); },
    squeak() { const f = rand(1500, 2400); tone(f, 0.07, { gain: 0.05, f1: f * 1.4, type: 'triangle' }); tone(f * 1.3, 0.09, { gain: 0.04, f1: f * 0.8, type: 'triangle', at: 0.07 }); },
    blip() { tone(880, 0.05, { gain: 0.08, type: 'square' }); },
    select() { tone(660, 0.05, { gain: 0.08, type: 'square' }); tone(990, 0.07, { gain: 0.08, type: 'square', at: 0.06 }); },
    clear() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.14, { gain: 0.1, type: 'square', at: i * 0.11 })); },
    lost() { tone(300, 0.18, { gain: 0.14, f1: 180, type: 'sawtooth' }); tone(220, 0.25, { gain: 0.12, f1: 110, type: 'sawtooth', at: 0.16 }); },
    over() { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.22, { gain: 0.12, type: 'square', at: i * 0.2 })); },
  };
  return {
    unlock, sfx,
    setMuted(m) { if (master) master.gain.value = m ? 0 : 0.8; },
  };
})();

// ---------- tube overlays: noise, scanlines, vignette ----------
let noiseTiles = [], noisePatterns = [], noiseIdx = 0, scanPattern = null, vignette = null;
function buildNoise() {
  noiseTiles = []; noisePatterns = [];
  const N = 128, [r, g, b] = PAL.rgb[4];
  for (let k = 0; k < 6; k++) {
    const c = document.createElement('canvas'); c.width = N; c.height = N;
    const x = c.getContext('2d');
    const img = x.createImageData(N, N), d = img.data;
    for (let i = 0; i < N * N; i++) {
      const v = Math.random() * Math.random();
      const o = i * 4; d[o] = r * v; d[o + 1] = g * v; d[o + 2] = b * v; d[o + 3] = 255;
    }
    x.putImageData(img, 0, 0);
    noiseTiles.push(c);
    noisePatterns.push(ctx.createPattern(c, 'repeat'));
  }
}
function buildScan() {
  const c = document.createElement('canvas'); c.width = 1; c.height = 3;
  const x = c.getContext('2d'); x.fillStyle = 'rgba(0,0,0,0.30)'; x.fillRect(0, 2, 1, 1);
  scanPattern = ctx.createPattern(c, 'repeat');
}
function buildVignette() {
  const r = Math.hypot(W, H) / 2;
  vignette = ctx.createRadialGradient(W / 2, H / 2, r * 0.35, W / 2, H / 2, r * 1.02);
  vignette.addColorStop(0, PAL.a(0, 0));
  vignette.addColorStop(0.7, PAL.a(0, 0.25));
  vignette.addColorStop(1, PAL.a(0, 0.92));
}
paletteListeners.push(buildNoise, buildVignette);
resizeListeners.push(buildVignette);

function drawTubeOverlays(noiseAlpha) {
  const pat = noisePatterns[noiseIdx = (noiseIdx + 1) % noisePatterns.length];
  ctx.save();
  ctx.setTransform(DPR, 0, 0, DPR, -Math.random() * 128, -Math.random() * 128);
  ctx.globalAlpha = noiseAlpha;
  ctx.fillStyle = pat;
  ctx.fillRect(0, 0, W + 128, H + 128);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = scanPattern;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

// ============================================================
// THE BARN: static backdrop, cover, grain, rats
// ============================================================
const floorY = d => CFG.wallBaseY + d * CFG.floorBand;   // depth 0 = at the wall, 1 = nearest a rat comes
const dScale = d => 0.72 + 0.55 * d;                                     // things nearer the scope look bigger

const HOLES = [{ x: 110, d: 0.05 }, { x: 880, d: 0.04 }, { x: 1760, d: 0.05 }, { x: 2490, d: 0.05 }];
const GRAIN = { x: 1300, d: 0.16, w: 190, h: 120 };
const COVER = [
  { kind: 'hay',    x: 330,  w: 250, d: 0.36, h: 150 },
  { kind: 'barrel', x: 1010, w: 110, d: 0.55, h: 160 },
  { kind: 'crate',  x: 1560, w: 170, d: 0.22, h: 130 },
  { kind: 'barrel', x: 2130, w: 110, d: 0.42, h: 160 },
  { kind: 'crate',  x: 2270, w: 150, d: 0.40, h: 110 },
];

// ---------- static backdrop, rendered once per palette into an offscreen canvas ----------
const BG_SCALE = 1.1;
let bg = null;
function buildBackdrop() {
  const c = document.createElement('canvas');
  c.width = Math.round(CFG.worldW * BG_SCALE); c.height = Math.round(CFG.worldH * BG_SCALE);
  const g = c.getContext('2d');
  g.scale(BG_SCALE, BG_SCALE);
  const R = mulberry(7);
  const Wd = CFG.worldW, base = CFG.wallBaseY;

  // rafters: dark, with a few beams catching the illuminator
  g.fillStyle = PAL.ramp[0]; g.fillRect(0, 0, Wd, 270);
  g.strokeStyle = PAL.a(1, 0.9); g.lineWidth = 26;
  for (let x = -200; x < Wd + 200; x += 520) { g.beginPath(); g.moveTo(x, 270); g.lineTo(x + 420, 0); g.stroke(); }
  g.strokeStyle = PAL.a(2, 0.55); g.lineWidth = 3;
  for (let x = -200; x < Wd + 200; x += 520) { g.beginPath(); g.moveTo(x - 12, 270); g.lineTo(x + 408, 0); g.stroke(); }
  g.fillStyle = PAL.a(1, 1); g.fillRect(0, 258, Wd, 22);          // top plate
  g.fillStyle = PAL.a(3, 0.5); g.fillRect(0, 258, Wd, 3);

  // wall boards
  for (let y = 280; y < base; y += 62) {
    const v = 0.55 + R() * 0.3;
    g.fillStyle = PAL.a(1, v); g.fillRect(0, y, Wd, 62);
    g.fillStyle = PAL.a(2, 0.35 * v); g.fillRect(0, y + 2, Wd, 6);     // lit top edge of each board
    g.fillStyle = PAL.a(0, 0.9); g.fillRect(0, y + 58, Wd, 4);         // gap
    // grain and knots
    g.strokeStyle = PAL.a(2, 0.18); g.lineWidth = 1.5;
    for (let k = 0; k < 14; k++) { const x0 = R() * Wd, len = 60 + R() * 220; g.beginPath(); g.moveTo(x0, y + 10 + R() * 40); g.lineTo(x0 + len, y + 10 + R() * 40); g.stroke(); }
    if (R() < 0.6) { g.fillStyle = PAL.a(0, 0.6); g.beginPath(); g.ellipse(R() * Wd, y + 30, 7, 4, 0, 0, TAU); g.fill(); }
  }
  // posts
  for (const px of [0, 650, 1300, 1950, 2600]) {
    g.fillStyle = PAL.a(2, 0.8); g.fillRect(px - 22, 258, 44, base - 258);
    g.fillStyle = PAL.a(0, 0.7); g.fillRect(px - 22, 258, 6, base - 258);
    g.fillStyle = PAL.a(3, 0.55); g.fillRect(px + 12, 258, 4, base - 258);
  }
  // a window: the one thing brighter than the illuminator, it blooms
  g.save();
  g.shadowColor = PAL.ramp[5]; g.shadowBlur = 40;
  g.fillStyle = PAL.a(4, 0.9); g.fillRect(1850, 330, 150, 130);
  g.restore();
  g.fillStyle = PAL.a(1, 1); g.fillRect(1920, 330, 10, 130); g.fillRect(1850, 390, 150, 10);
  g.strokeStyle = PAL.a(2, 1); g.lineWidth = 8; g.strokeRect(1850, 330, 150, 130);
  // pipe along the wall, wire coil, a shovel
  g.fillStyle = PAL.a(3, 0.7); g.fillRect(0, 700, Wd, 14); g.fillStyle = PAL.a(0, 0.5); g.fillRect(0, 710, Wd, 4);
  for (const bx of [420, 1180, 1990, 2380]) { g.fillStyle = PAL.a(2, 0.9); g.fillRect(bx, 694, 26, 26); }
  g.strokeStyle = PAL.a(3, 0.6); g.lineWidth = 3;
  for (let i = 0; i < 9; i++) { g.beginPath(); g.ellipse(730, 560 + i * 3, 46 - i * 1.5, 30, 0, 0, TAU); g.stroke(); }
  g.strokeStyle = PAL.a(2, 0.9); g.lineWidth = 9; g.beginPath(); g.moveTo(2390, 900); g.lineTo(2470, 520); g.stroke();
  g.fillStyle = PAL.a(2, 0.9); g.beginPath(); g.moveTo(2450, 560); g.lineTo(2500, 530); g.lineTo(2480, 470); g.lineTo(2430, 500); g.closePath(); g.fill();
  // mesh panel leaning on the wall (like the clip)
  g.strokeStyle = PAL.a(3, 0.45); g.lineWidth = 1.5;
  for (let x = 1610; x <= 1740; x += 13) { g.beginPath(); g.moveTo(x, 560); g.lineTo(x, 900); g.stroke(); }
  for (let y = 560; y <= 900; y += 13) { g.beginPath(); g.moveTo(1610, y); g.lineTo(1740, y); g.stroke(); }
  g.strokeStyle = PAL.a(2, 0.9); g.lineWidth = 6; g.strokeRect(1610, 560, 130, 340);

  // floor: brighter near the scope, boards converging away
  const fg = g.createLinearGradient(0, base, 0, CFG.worldH);
  fg.addColorStop(0, PAL.a(1, 1)); fg.addColorStop(1, PAL.a(2, 0.85));
  g.fillStyle = fg; g.fillRect(0, base, Wd, CFG.worldH - base);
  g.strokeStyle = PAL.a(0, 0.45); g.lineWidth = 2;
  for (let i = -6; i <= 26; i++) {
    const xf = i * 130, xn = Wd / 2 + (xf - Wd / 2) * 1.9;
    g.beginPath(); g.moveTo(xf, base); g.lineTo(xn, CFG.worldH); g.stroke();
  }
  // baseboard and the dirt line where the wall meets the floor
  g.fillStyle = PAL.a(2, 0.9); g.fillRect(0, base - 26, Wd, 26);
  g.fillStyle = PAL.a(0, 0.55); g.fillRect(0, base - 4, Wd, 10);
  // straw
  for (let i = 0; i < 260; i++) {
    const x = R() * Wd, y = base + 10 + R() * (CFG.worldH - base - 10), len = 12 + R() * 34, a = (R() - 0.5) * 1.2;
    g.strokeStyle = PAL.a(R() < 0.5 ? 3 : 4, 0.25 + R() * 0.35); g.lineWidth = 1.5 + R() * 1.5;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len * 0.5); g.stroke();
  }
  // rat holes: gnawed dark arches at the base of the wall
  for (const h of HOLES) {
    const y = floorY(h.d);
    g.fillStyle = PAL.a(2, 0.7); g.beginPath(); g.ellipse(h.x, y - 4, 60, 40, 0, Math.PI, TAU); g.fill();
    g.fillStyle = PAL.ramp[0]; g.beginPath(); g.ellipse(h.x, y - 2, 48, 32, 0, Math.PI, TAU); g.fill();
    g.fillStyle = PAL.a(3, 0.6);
    for (let k = 0; k < 7; k++) g.fillRect(h.x - 60 + R() * 120, y + R() * 26, 4 + R() * 6, 3);
  }
  bg = c;
}
paletteListeners.push(buildBackdrop);

function drawBackdrop() {
  // blit only the visible slice of the pre-rendered barn
  const s = viewScale();
  const [wx0, wy0] = screenToWorld(0, 0);
  const [wx1, wy1] = screenToWorld(W, H);
  const sx = clamp(wx0, 0, CFG.worldW), sy = clamp(wy0, 0, CFG.worldH);
  const ex = clamp(wx1, 0, CFG.worldW), ey = clamp(wy1, 0, CFG.worldH);
  if (ex <= sx || ey <= sy) return;
  const [dx, dy] = worldToScreen(sx, sy);
  ctx.drawImage(bg, sx * BG_SCALE, sy * BG_SCALE, (ex - sx) * BG_SCALE, (ey - sy) * BG_SCALE, dx, dy, (ex - sx) * s, (ey - sy) * s);
}

// ---------- cover objects (drawn in world space) ----------
function coverRect(c) {
  const s = dScale(c.d), y = floorY(c.d);
  return { x0: c.x - c.w * s / 2, x1: c.x + c.w * s / 2, y0: y - c.h * s, y1: y };
}
function drawCover(c) {
  const s = dScale(c.d), y = floorY(c.d), w = c.w, h = c.h;
  ctx.save(); ctx.translate(c.x, y); ctx.scale(s, s);
  ctx.fillStyle = PAL.a(0, 0.5); ctx.beginPath(); ctx.ellipse(0, 4, w * 0.55, 10, 0, 0, TAU); ctx.fill();
  if (c.kind === 'crate') {
    ctx.fillStyle = PAL.ramp[2]; ctx.fillRect(-w / 2, -h, w, h);
    ctx.fillStyle = PAL.a(1, 0.8);
    for (let k = 1; k < 4; k++) ctx.fillRect(-w / 2, -h + k * h / 4 - 2, w, 4);
    ctx.strokeStyle = PAL.a(3, 0.8); ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(-w / 2 + 8, -8); ctx.lineTo(w / 2 - 8, -h + 8); ctx.stroke();
    ctx.strokeStyle = PAL.a(3, 1); ctx.lineWidth = 4; ctx.strokeRect(-w / 2, -h, w, h);
    ctx.fillStyle = PAL.a(4, 0.7); ctx.fillRect(-w / 2, -h, w, 5);
  } else if (c.kind === 'barrel') {
    ctx.fillStyle = PAL.ramp[2];
    ctx.beginPath(); ctx.moveTo(-w / 2, 0); ctx.quadraticCurveTo(-w * 0.62, -h / 2, -w / 2, -h); ctx.lineTo(w / 2, -h); ctx.quadraticCurveTo(w * 0.62, -h / 2, w / 2, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = PAL.a(1, 0.7); ctx.fillRect(-w * 0.15, -h, w * 0.1, h);
    ctx.fillStyle = PAL.a(4, 0.75); ctx.fillRect(-w * 0.55, -h * 0.3, w * 1.1, 8); ctx.fillRect(-w * 0.55, -h * 0.75, w * 1.1, 8);
    ctx.fillStyle = PAL.a(1, 1); ctx.beginPath(); ctx.ellipse(0, -h, w / 2, 10, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = PAL.a(4, 0.6); ctx.lineWidth = 3; ctx.stroke();
  } else { // hay: two bales, one on top
    const bale = (bx, by, bw, bh) => {
      ctx.fillStyle = PAL.ramp[2];
      ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 10); ctx.fill();
      ctx.strokeStyle = PAL.a(1, 0.6); ctx.lineWidth = 1.5;
      for (let k = 0; k < 24; k++) { const x = bx + 6 + Math.random() * (bw - 12), yy = by + 6 + Math.random() * (bh - 12); ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x + 10, yy + 3); ctx.stroke(); }
      ctx.fillStyle = PAL.a(4, 0.6); ctx.fillRect(bx + 4, by + 2, bw - 8, 4);
      ctx.strokeStyle = PAL.a(3, 0.9); ctx.lineWidth = 3; ctx.strokeRect(bx + bw * 0.3, by, 3, bh); ctx.strokeRect(bx + bw * 0.68, by, 3, bh);
    };
    bale(-w / 2, -h * 0.55, w, h * 0.55);
    bale(-w * 0.32, -h, w * 0.7, h * 0.47);
  }
  ctx.restore();
}

// ---------- the grain pile the rats are after ----------
function drawGrain(sacks) {
  const s = dScale(GRAIN.d), y = floorY(GRAIN.d);
  ctx.save(); ctx.translate(GRAIN.x, y); ctx.scale(s, s);
  ctx.fillStyle = PAL.a(0, 0.5); ctx.beginPath(); ctx.ellipse(0, 4, 110, 12, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = PAL.a(4, 0.8);
  for (let k = 0; k < 18; k++) { const a = k * 2.4, r = 70 + (k * 37 % 50); ctx.beginPath(); ctx.arc(Math.cos(a) * r, 2 + Math.sin(a) * r * 0.18, 2.2, 0, TAU); ctx.fill(); }
  const sack = (sx, sy, flat) => {
    ctx.save(); ctx.translate(sx, sy);
    ctx.fillStyle = PAL.ramp[3];
    ctx.beginPath();
    if (flat) { ctx.roundRect(-46, -18, 92, 18, 8); }
    else { ctx.moveTo(-44, 0); ctx.quadraticCurveTo(-52, -40, -34, -62); ctx.quadraticCurveTo(0, -78, 34, -62); ctx.quadraticCurveTo(52, -40, 44, 0); ctx.closePath(); }
    ctx.fill();
    if (!flat) {
      ctx.fillStyle = PAL.a(4, 0.55); ctx.beginPath(); ctx.ellipse(-8, -46, 22, 12, -0.4, 0, TAU); ctx.fill();
      ctx.strokeStyle = PAL.a(2, 0.9); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-30, -62); ctx.lineTo(30, -62); ctx.stroke();
      ctx.fillStyle = PAL.a(2, 1); ctx.beginPath(); ctx.ellipse(0, -70, 16, 7, 0, 0, TAU); ctx.fill();
    }
    ctx.strokeStyle = PAL.a(2, 0.7); ctx.lineWidth = 1.5;
    for (let k = -30; k <= 30; k += 12) { ctx.beginPath(); ctx.moveTo(k, flat ? -14 : -6); ctx.lineTo(k, flat ? -4 : -52); ctx.stroke(); }

function grainRect() {
  const s = dScale(GRAIN.d), y = floorY(GRAIN.d);

// ---------- rats ----------
const rats = [];
class Rat {
  constructor(round, hole, demo) {
    const L = CFG.ratLength;
    this.L = L; this.demo = !!demo;
    this.x = hole.x; this.d = hole.d; this.dir = hole.x < CFG.worldW / 2 ? 1 : -1;
    this.home = hole;
    const diff = 1 + 0.11 * (round - 1);
    this.speed = CFG.ratBaseSpeed * diff * rand(0.88, 1.15);
    this.pauseMul = clamp(1.15 - round * 0.06, 0.45, 1.15);
    this.sizeMul = rand(0.9, 1.1);
    this.state = 'emerge'; this.t = 0; this.wait = rand(0.35, 1.0);
    this.alive = true; this.dead = false; this.deadT = 0; this.alpha = 1; this.spin = 0;
    this.legPhase = rand(0, TAU); this.tailPhase = rand(0, TAU); this.bob = 0;
    this.goal = Math.random() < 0.72 ? 'grain' : 'cross';
    this.carrying = false; this.eatDur = rand(2.2, 3.6) * this.pauseMul;
    this.route = this.goal === 'grain' ? this.routeToGrain() : this.routeAcross();
    this.wp = null;
  }
  stopNear(fromX, toX) {
    // a sniff stop somewhere on the way, sometimes tucked behind cover
    const cx = lerp(fromX, toX, rand(0.3, 0.7));
    const hide = Math.random() < 0.35 && COVER.find(c => c.d > 0.3 && Math.abs(c.x - cx) < 320);
    if (hide) return { x: hide.x + rand(-hide.w * 0.2, hide.w * 0.2), d: clamp(hide.d - rand(0.12, 0.25), 0.03, 0.9), pause: rand(0.6, 1.6) * this.pauseMul };
    return { x: cx, d: rand(0.04, 0.55), pause: Math.random() < 0.65 ? rand(0.4, 1.3) * this.pauseMul : 0 };
  }
  routeToGrain() {
    const r = [];
    if (Math.random() < 0.8) r.push(this.stopNear(this.x, GRAIN.x));
    r.push({ x: GRAIN.x + rand(-60, 60), d: GRAIN.d + rand(0.03, 0.09), pause: 0, action: 'eat' });
    return r;
  }
  routeAcross() {
    const far = HOLES.filter(h => Math.sign(h.x - this.x) === this.dir);
    const dest = far.length ? pick(far) : pick(HOLES);
    const r = [this.stopNear(this.x, dest.x)];
    if (Math.random() < 0.5) r.push(this.stopNear(this.x, dest.x));
    r.push({ x: dest.x, d: dest.d, pause: 0, action: 'escape' });
    return r;
  }
  routeHome() {
    const dest = Math.random() < 0.6 ? this.home : pick(HOLES);
    const r = [];
    if (Math.random() < 0.5) r.push(this.stopNear(this.x, dest.x));
    r.push({ x: dest.x, d: dest.d, pause: 0, action: 'escape' });
    return r;
  }
  next() {
    this.wp = this.route.shift() || null;
    if (!this.wp) { this.state = 'run'; this.wp = { x: this.home.x, d: this.home.d, pause: 0, action: 'escape' }; }
    this.state = 'run';
  }
  update(dt, hooks) {
    if (this.dead) {
      this.deadT += dt;
      this.spin = Math.min(1, this.deadT * 4);
      if (this.deadT > 1.1) this.alpha = Math.max(0, 1 - (this.deadT - 1.1) / 0.8);
      if (this.deadT > 2.0) this.alive = false;
      return;
    }
    this.t += dt;
    this.tailPhase += dt * 6;
    if (this.state === 'emerge') { if (this.t > this.wait) { this.t = 0; this.next(); } return; }
    if (this.state === 'sniff') { if (this.t > this.wp.pause) { this.t = 0; this.next(); } else if (Math.random() < dt * 0.35) hooks.squeak(this); return; }
    if (this.state === 'eat') {

      return;
    }
    // run
    const wp = this.wp, dx = wp.x - this.x, ax = Math.abs(dx);
    const step = this.speed * dt * (this.carrying ? 0.85 : 1);
    if (ax > 1) this.dir = Math.sign(dx);
    if (ax <= step) { this.x = wp.x; this.d = wp.d; this.arrive(hooks); return; }
    this.x += this.dir * step;
    this.d += (wp.d - this.d) * Math.min(1, step / ax);
    this.legPhase += step * 0.16;
    this.bob = Math.sin(this.legPhase) * 1.5;
  }
  arrive(hooks) {
    const wp = this.wp; this.t = 0;

    if (wp.pause > 0) { this.state = 'sniff'; return; }

  }
  hitTest(wx, wy) {

    const s = dScale(this.d) * this.sizeMul, y = floorY(this.d), L = this.L;
    const lx = (wx - this.x) / (s * this.dir), ly = (wy - y) / s;
    const body = ((lx / (L * 0.44)) ** 2 + ((ly + 14) / (L * 0.25)) ** 2) <= 1;
    const head = (((lx - L * 0.36) / (L * 0.22)) ** 2 + ((ly + 18) / (L * 0.17)) ** 2) <= 1;
    return body || head;
  }
  kill() { this.dead = true; this.deadT = 0; this.state = 'dead'; }
  draw() {
    const s = dScale(this.d) * this.sizeMul, y = floorY(this.d), L = this.L;
    const eating = this.state === 'eat', sniff = this.state === 'sniff';
    ctx.save();
    ctx.translate(this.x, y);
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = PAL.a(0, 0.5); ctx.beginPath(); ctx.ellipse(0, 2, L * 0.42 * s, 7 * s, 0, 0, TAU); ctx.fill();
    ctx.scale(this.dir * s, s);
    if (this.dead) { ctx.translate(0, -12); ctx.rotate(this.spin * Math.PI); ctx.translate(0, 12); }
    const bob = this.dead ? 0 : this.bob;
    // tail
    ctx.strokeStyle = PAL.ramp[3]; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-L * 0.42, -10 + bob);
    ctx.quadraticCurveTo(-L * 0.72, -22 + Math.sin(this.tailPhase) * 9, -L * 0.98, -4 + Math.cos(this.tailPhase * 0.7) * 7);
    ctx.stroke();
    // legs
    ctx.strokeStyle = PAL.ramp[3]; ctx.lineWidth = 3;
    const legs = [[L * 0.22, 0], [L * 0.12, Math.PI], [-L * 0.14, Math.PI], [-L * 0.26, 0]];
    for (const [lx, ph] of legs) {
      const sw = this.dead ? 0 : (this.state === 'run' ? Math.sin(this.legPhase + ph) * 7 : 0);
      ctx.beginPath(); ctx.moveTo(lx, -6 + bob); ctx.lineTo(lx + sw, 3); ctx.stroke();
    }

    ctx.fillStyle = PAL.ramp[4];
    ctx.beginPath(); ctx.ellipse(0, -14 + bob, L * 0.36, L * 0.17, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = PAL.a(5, 0.5);
    ctx.beginPath(); ctx.ellipse(-L * 0.05, -20 + bob, L * 0.22, L * 0.07, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = PAL.a(2, 0.5);
    ctx.beginPath(); ctx.ellipse(0, -7 + bob, L * 0.3, L * 0.06, 0, 0, TAU); ctx.fill();
    // head
    const hdy = eating ? 7 + Math.sin(this.t * 14) * 2 : (sniff ? Math.sin(this.t * 22) * 1.5 : 0);
    ctx.save(); ctx.translate(L * 0.36, -18 + bob + hdy); if (eating) ctx.rotate(0.35);
    ctx.fillStyle = PAL.ramp[4];
    ctx.beginPath(); ctx.ellipse(0, 0, L * 0.17, L * 0.11, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = PAL.ramp[3];
    ctx.beginPath(); ctx.arc(-L * 0.07, -L * 0.11, 5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(L * 0.0, -L * 0.13, 4.5, 0, TAU); ctx.fill();
    ctx.fillStyle = PAL.ramp[4]; ctx.beginPath(); ctx.arc(L * 0.17, 0, 2.2, 0, TAU); ctx.fill();
    ctx.strokeStyle = PAL.a(4, 0.45); ctx.lineWidth = 1;
    for (const a of [-0.35, 0, 0.35]) { ctx.beginPath(); ctx.moveTo(L * 0.14, 1); ctx.lineTo(L * 0.14 + Math.cos(a) * 16, 1 + Math.sin(a) * 16 + (sniff ? Math.sin(this.t * 30) : 0)); ctx.stroke(); }
    // the eye: retro-reflective, the thing that gives a rat away in night vision
    if (this.dead) { ctx.fillStyle = PAL.ramp[2]; ctx.beginPath(); ctx.arc(L * 0.05, -2, 2.4, 0, TAU); ctx.fill(); }
    else { ctx.shadowColor = PAL.ramp[5]; ctx.shadowBlur = 10; ctx.fillStyle = PAL.ramp[6]; ctx.beginPath(); ctx.arc(L * 0.05, -2, 2.8, 0, TAU); ctx.fill(); }
    ctx.restore();
    if (this.carrying && !this.dead) { ctx.fillStyle = PAL.ramp[4]; ctx.beginPath(); ctx.ellipse(L * 0.5, -22 + bob, 8, 6, 0, 0, TAU); ctx.fill(); }
    ctx.restore();
  }
}

// ---------- particles, impact marks, floating text ----------
const particles = [], marks = [], floats = [];
function impact(wx, wy, kind) {
  const n = kind === 'wall' ? 6 : 9;
  for (let i = 0; i < n; i++) particles.push({ x: wx, y: wy, vx: rand(-90, 90), vy: rand(-140, -20), life: rand(0.25, 0.55), t: 0, r: rand(1.5, 3.5), g: kind === 'wall' ? 160 : 260 });
  particles.push({ x: wx, y: wy, vx: 0, vy: 0, life: 0.09, t: 0, r: 9, flash: true });
  marks.push({ x: wx, y: wy, kind, r: rand(4, 7) });
  if (marks.length > 40) marks.shift();
}
function addFloat(wx, wy, text, big, warn) { floats.push({ x: wx, y: wy, text, t: 0, life: 1.1, big: !!big, warn: !!warn }); }
function updateFx(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.t += dt;
    if (p.t >= p.life) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt;
  }
  for (let i = floats.length - 1; i >= 0; i--) { const f = floats[i]; f.t += dt; if (f.t >= f.life) floats.splice(i, 1); }
}
function drawMarks() {
  for (const m of marks) {
    ctx.fillStyle = m.kind === 'wall' ? PAL.a(0, 0.75) : PAL.a(2, 0.7);
    ctx.beginPath(); ctx.ellipse(m.x, m.y, m.r, m.r * (m.kind === 'floor' ? 0.5 : 1), 0, 0, TAU); ctx.fill();
    ctx.fillStyle = PAL.a(4, 0.5); ctx.beginPath(); ctx.arc(m.x + 1, m.y - 1, m.r * 0.35, 0, TAU); ctx.fill();
  }
}
function drawParticles() {
  for (const p of particles) {
    const k = 1 - p.t / p.life;
    if (p.flash) { ctx.save(); ctx.shadowColor = PAL.ramp[6]; ctx.shadowBlur = 24; ctx.fillStyle = PAL.a(6, k); ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + (1 - k) * 2), 0, TAU); ctx.fill(); ctx.restore(); continue; }
    ctx.fillStyle = PAL.a(5, k * 0.9); ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
  }
}
function drawFloats() {
  // floating text lives in world space but is sized in screen pixels
  const s = viewScale();
  for (const f of floats) {
    const k = f.t / f.life;
    const [sx, sy] = worldToScreen(f.x, f.y);
    ctx.save(); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = 1 - k * k;
    ctx.font = (f.big ? 34 : 24) + 'px ' + FONT_DISPLAY;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = f.warn ? PAL.warn : PAL.ramp[6];
    ctx.fillText(f.text, sx, sy - 40 * s / cam.zoom - k * 30);
    ctx.restore();
  }
}

// ---------- what did the bullet hit? nearest thing first ----------
function hitTest(wx, wy) {
  const things = [];
  for (const r of rats) if (r.alive && !r.dead) things.push({ type: 'rat', d: r.d, rat: r });
  for (const c of COVER) things.push({ type: 'cover', d: c.d, c });
  things.push({ type: 'sack', d: GRAIN.d, rect: grainRect() });
  things.sort((a, b) => b.d - a.d);
  for (const t of things) {
    if (t.type === 'rat') { if (t.rat.hitTest(wx, wy)) return t; continue; }
    const r = t.rect || coverRect(t.c);
    if (wx >= r.x0 && wx <= r.x1 && wy >= r.y0 && wy <= r.y1) return t;
  }
  return { type: wy < CFG.wallBaseY ? 'wall' : 'floor' };
}

// ---------- draw the whole barn, back to front ----------
function drawWorld(sacks) {
  ctx.save();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBackdrop();
  const s = viewScale();
  ctx.translate(W / 2, H / 2); ctx.scale(s, s); ctx.translate(-cam.x - kick.x - sway.x, -cam.y - kick.y - sway.y);
  drawMarks();
  const order = [];
  for (const r of rats) if (r.alive) order.push({ d: r.d, f: () => r.draw() });
  for (const c of COVER) order.push({ d: c.d, f: () => drawCover(c) });
  order.push({ d: GRAIN.d, f: () => drawGrain(sacks) });
  order.sort((a, b) => a.d - b.d);
  for (const o of order) o.f();
  drawParticles();
  ctx.restore();
}

// ============================================================
// GAME STATE
// ============================================================
const G = {
  state: 'boot',      // boot | title | options | help | intro | play | paused | clear | over
  stateT: 0, bootT: 0, time: 0, round: 0, score: 0,
  best: store.get('rh.best', 0), bestRound: store.get('rh.bestRound', 0), newBest: false,
  sacks: CFG.sacks, mag: CFG.magSize, reserve: 0,
  reloading: 0, bolt: 0, boltSfx: 0, autoReload: false,
  ratsTotal: 0, ratsSpawned: 0, ratsHit: 0, ratsEscaped: 0, spawnT: 0, endDelay: 0,
  shots: 0, hits: 0, streak: 0, bestStreak: 0, roundShots: 0, roundHits: 0,
  flash: 0, agc: 0, warnText: '', warnT: 0, warnColor: null, demoT: 0, swayT: 0,
  hitMark: 0, didDrag: false, didFire: false, tutDone: store.get('rh.tut', false),
};
let rows = [];           // tappable menu rows, rebuilt every frame the menu is drawn
const BTN = {};
const pressed = new Set();   // button ids currently held down, for pressed-state drawing

// keep the screen awake while playing (Safari 16.4+, and the wrapper sets the idle timer natively)
let wakeLock = null;
async function keepAwake() {
  try {
    if (!('wakeLock' in navigator) || wakeLock) return;
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch (e) { wakeLock = null; }
}

function layoutButtons() {
  const r = clamp(W * 0.11, 36, 46);
  const by = H - SAFE.b - 24 - r;
  const lx = SAFE.l + 26 + r, rx = W - SAFE.r - 26 - r;
  const fx = OPT.leftHand ? lx : rx, ox = OPT.leftHand ? rx : lx;
  BTN.fire = { id: 'fire', x: fx, y: by, r };
  BTN.reload = { id: 'reload', x: ox, y: by, r: r * 0.74 };
  BTN.zoom = { id: 'zoom', x: fx, y: by - r - 46, r: 26 };
  BTN.pause = { id: 'pause', x: ox, y: by - r * 0.74 - 46, r: 22 };
}
resizeListeners.push(layoutButtons);

function setState(s) { G.state = s; G.stateT = 0; rows = []; }
function warn(text, color) { G.warnText = text; G.warnT = 1.6; G.warnColor = color || PAL.warn; }
const hooks = {
  squeak() { if (Math.random() < 0.5) Audio.sfx.squeak(); },
  escaped(r) {
    if (r.demo || G.state !== 'play') return;
    G.ratsEscaped++;
    if (r.carrying) {
      G.sacks--; Audio.sfx.lost(); haptic('lost');
      addFloat(r.x, floorY(r.d) - 20, 'SACK STOLEN', true, true);
      if (G.sacks <= 0) { gameOver(); return; }
      warn('SACK STOLEN  ·  ' + G.sacks + ' LEFT');
    } else { addFloat(r.x, floorY(r.d) - 20, 'ESCAPED', false, true); }
  },
};

function startGame() {
  Object.assign(G, { score: 0, sacks: CFG.sacks, round: 0, shots: 0, hits: 0, streak: 0, bestStreak: 0, time: 0, newBest: false, didDrag: false, didFire: false });
  rats.length = 0; particles.length = 0; marks.length = 0; floats.length = 0;
  cam.x = CFG.worldW / 2; cam.y = 1010; cam.zoomT = 1;
  keepAwake();
  startRound(1);
}
function startRound(n) {
  G.round = n;
  G.ratsTotal = Math.min(4 + n, 14);
  Object.assign(G, { ratsSpawned: 0, ratsHit: 0, ratsEscaped: 0, roundShots: 0, roundHits: 0, endDelay: 0, reloading: 0, bolt: 0, boltSfx: 0, autoReload: false });
  G.spawnT = rand(0.6, 1.2);
  G.mag = CFG.magSize;
  G.reserve = Math.max(5, G.ratsTotal * CFG.ammoPerRat - CFG.magSize);
  rats.length = 0;
  setState('intro');
}
function endRound() {
  G.ammoBonus = (G.mag + G.reserve) * 15;
  const acc = G.roundShots ? G.roundHits / G.roundShots : 0;
  G.accBonus = acc >= 0.75 ? 250 : acc >= 0.5 ? 100 : 0;
  G.score += G.ammoBonus + G.accBonus;
  if (G.round > G.bestRound) { G.bestRound = G.round; store.set('rh.bestRound', G.bestRound); }
  Audio.sfx.clear();
  setState('clear');
}
function gameOver() {
  G.newBest = G.score > G.best;
  if (G.newBest) { G.best = G.score; store.set('rh.best', G.best); }
  Audio.sfx.over(); haptic('lost');
  setState('over');
}

function fire() {
  if (G.state === 'title') { Audio.sfx.select(); startGame(); return; }
  if (G.state === 'over') { if (G.stateT > 0.8) { Audio.sfx.select(); startGame(); } return; }
  if (G.state === 'intro') { setState('play'); return; }
  if (G.state === 'clear') { startRound(G.round + 1); return; }
  if (G.state !== 'play' || G.reloading > 0 || G.bolt > 0) return;
  if (G.mag <= 0) {
    Audio.sfx.empty(); haptic('tap');
    if (G.reserve > 0) reload(); else warn('OUT OF AMMO');
    return;
  }
  G.mag--; G.shots++; G.roundShots++;
  G.bolt = CFG.boltTime; G.boltSfx = 0.14;
  G.flash = REDUCED ? 0.45 : 1; G.agc = 1;
  if (!G.didFire) { G.didFire = true; if (!G.tutDone) { G.tutDone = true; store.set('rh.tut', true); } }
  Audio.sfx.shot(); haptic('fire');
  const [wx, wy] = screenToWorld(W / 2, H / 2);   // sample the aim point before the recoil moves the view
  const hit = hitTest(wx, wy);
  const rk = REDUCED ? 0.35 : 1;
  kick.y -= 34 * rk / cam.zoom; kick.x += rand(-9, 9) * rk / cam.zoom;
  if (hit.type === 'rat') killRat(hit.rat, wx, wy);
  else {
    impact(wx, wy, hit.type === 'floor' ? 'floor' : 'wall');
    if (G.streak >= 2) addFloat(wx, wy, 'MISS', false, true);
    G.streak = 0;
  }
  if (G.mag === 0 && G.reserve > 0) G.autoReload = true;
}
function killRat(r, wx, wy) {
  r.kill();
  G.hitMark = 0.3;
  G.hits++; G.roundHits++; G.ratsHit++; G.streak++;
  G.bestStreak = Math.max(G.bestStreak, G.streak);
  const moving = r.state === 'run' ? 50 : 0;
  const far = Math.round(60 * (1 - r.d));
  const mult = 1 + 0.5 * Math.min(G.streak - 1, 4);
  const pts = Math.round((100 + moving + far) * mult);
  G.score += pts;
  addFloat(r.x, floorY(r.d) - 10, '+' + pts + (G.streak >= 2 ? '  ×' + G.streak : ''), G.streak >= 3);
  for (let i = 0; i < 7; i++) particles.push({ x: wx, y: wy, vx: rand(-120, 120), vy: rand(-160, -40), life: rand(0.3, 0.6), t: 0, r: rand(1.5, 3), g: 300 });
  Audio.sfx.hit(); haptic('hit');
}
function reload() {
  if (G.state !== 'play' || G.reloading > 0 || G.mag >= CFG.magSize || G.reserve <= 0) { if (G.state === 'play' && G.reserve <= 0 && G.mag < CFG.magSize) warn('NO SPARE ROUNDS'); return; }
  G.reloading = CFG.reloadTime; G.autoReload = false;
  Audio.sfx.reload(); haptic('reload');
}
function finishReload() {
  const n = Math.min(CFG.magSize - G.mag, G.reserve);
  G.mag += n; G.reserve -= n;
}
function toggleZoom() { cam.zoomT = cam.zoomT === 1 ? 2 : 1; Audio.sfx.blip(); haptic('tap'); }
function togglePause() {
  if (G.state === 'play') { setState('paused'); Audio.sfx.blip(); }
  else if (G.state === 'paused') { setState('play'); Audio.sfx.blip(); }
}
function cyclePalette() {
  const i = PALETTE_ORDER.indexOf(OPT.palette);
  setPalette(PALETTE_ORDER[(i + 1) % PALETTE_ORDER.length]); saveOpt(); Audio.sfx.blip();
}
function setSound(on) { OPT.sound = on; Audio.setMuted(!on); saveOpt(); }

let aimId = null;

function buttonAt(x, y) {

function visibleButtons() {

function pressButton(b) {

}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();

  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* older browsers */ }
  for (const r of rows) if (x >= r.x0 && x <= r.x1 && y >= r.y0 && y <= r.y1) { Audio.sfx.blip(); haptic('tap'); r.onTap(); return; }
  const b = buttonAt(x, y);
  if (b) { pointers.set(e.pointerId, { role: 'btn', b }); pressed.add(b.id); pressButton(b); return; }
  if (G.state === 'boot') return;

canvas.addEventListener('pointermove', e => {

  if (e.pointerId !== aimId) return;   // a second finger only ever taps

  if (p.moved && (G.state === 'play' || G.state === 'title' || G.state === 'intro')) {
    if (G.state === 'play') G.didDrag = true;
    const s = viewScale();
    cam.x -= dx / s * OPT.aim; cam.y -= dy / s * OPT.aim;

  }
}, { passive: true });

canvas.addEventListener('touchstart', e => e.preventDefault(), { passive: false });   // no pinch/scroll gestures on the tube
canvas.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  if (e.repeat) return;
  Audio.unlock();
  const k = e.key;
  if (k === ' ' || k === 'Enter') { e.preventDefault(); fire(); }
  else if (k === 'r' || k === 'R') reload();
  else if (k === 'z' || k === 'Z') { if (G.state === 'play') toggleZoom(); }
  else if (k === 'p' || k === 'P' || k === 'Escape') { if (G.state === 'play' || G.state === 'paused') togglePause(); else if (G.state === 'options' || G.state === 'help') setState('title'); }

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (G.state === 'play') setState('paused'); }

// ============================================================
// UPDATE
// ============================================================
function spawnRat(demo) {
  rats.push(new Rat(demo ? 2 : G.round, pick(HOLES), demo));
  if (!demo) G.ratsSpawned++;
}
function update(dt) {

  cam.zoom += (cam.zoomT - cam.zoom) * Math.min(1, dt * 12);
  const kd = Math.exp(-dt * 8); kick.x *= kd; kick.y *= kd;
  G.flash = Math.max(0, G.flash - dt * 11);

  if (G.warnT > 0) G.warnT -= dt;
  if (G.boltSfx > 0) { G.boltSfx -= dt; if (G.boltSfx <= 0) Audio.sfx.bolt(); }

  const st = G.state;
  if (st === 'boot') { G.bootT += dt; if (G.bootT > 1.15) setState('title'); return; }
  if (st === 'paused') return;

  if (st === 'play') {
    G.time += dt; G.swayT += dt;
    const A = REDUCED ? 0 : (cam.zoom > 1.5 ? 5 : 2);
    sway.x = (Math.sin(G.swayT * 0.9) + 0.5 * Math.sin(G.swayT * 1.7)) * A;
    sway.y = Math.cos(G.swayT * 1.3) * A * 0.7;
    if (keys.size) {
      const v = 420 * dt / cam.zoom * OPT.aim;
      if (keys.has('ArrowLeft')) cam.x -= v; if (keys.has('ArrowRight')) cam.x += v;
      if (keys.has('ArrowUp')) cam.y -= v; if (keys.has('ArrowDown')) cam.y += v;
    }
    if (G.bolt > 0) { G.bolt -= dt; if (G.bolt <= 0 && G.autoReload) reload(); }
    if (G.reloading > 0) { G.reloading -= dt; if (G.reloading <= 0) finishReload(); }
    const maxAlive = Math.min(2 + Math.floor((G.round - 1) / 2), 5);
    const alive = rats.filter(r => r.alive && !r.dead).length;
    if (G.ratsSpawned < G.ratsTotal && alive < maxAlive) {
      G.spawnT -= dt;
      if (G.spawnT <= 0) { spawnRat(false); G.spawnT = rand(1.0, 2.4) * clamp(1.25 - G.round * 0.06, 0.5, 1.25); }
    }
    for (const r of rats) r.update(dt, hooks);
    if (G.state === 'play' && G.ratsSpawned >= G.ratsTotal && rats.every(r => !r.alive)) { G.endDelay += dt; if (G.endDelay > 0.6) endRound(); }
  } else {
    sway.x *= 0.9; sway.y *= 0.9;

      if (aimId === null) { cam.x = CFG.worldW / 2 + Math.sin(G.demoT * 0.12) * 600; cam.y = 1010; }
      G.demoT += dt;
      G.spawnT -= dt;
      if (G.spawnT <= 0 && rats.filter(r => r.alive).length < 3) { spawnRat(true); G.spawnT = rand(1.5, 3.5); }
      for (const r of rats) r.update(dt, hooks);
    } else if (st === 'intro') { if (G.stateT > CFG.roundIntro) setState('play'); }
    else if (st === 'clear') { if (G.stateT > CFG.roundClear) startRound(G.round + 1); }
    else if (st === 'over') { for (const r of rats) if (r.dead) r.update(dt, hooks); }
  }
  for (let i = rats.length - 1; i >= 0; i--) if (!rats[i].alive) rats.splice(i, 1);
  clampCam();
  updateFx(dt);
}

  rows.push({ x0: W / 2 - 150, y0: y - 10, x1: W / 2 + 150, y1: y + f.mid + 10, onTap: () => { Audio.sfx.select(); startGame(); } });
  y += f.mid * 2.4;
  menuRow('OPTIONS', y, f.mid, () => setState('options'), PAL.ramp[4]); y += f.mid * 2.1;
  menuRow('HOW TO PLAY', y, f.mid, () => setState('help'), PAL.ramp[4]); y += f.mid * 2.1;
  menuRow('NIGHT VISION ▸ ' + PAL.label, y, f.mid, cyclePalette, PAL.ramp[4]);
  const bl = SAFE.l + 16, bb = BTN.fire.y - BTN.fire.r - 6;
  label('BEST', bl, bb - f.small - 4, f.small, PAL.ramp[4]);
  text(pad(G.best, 7), bl - 1, bb - 2, f.big * 0.8, FONT_DISPLAY, PAL.ramp[6]);
  if (G.bestRound) label('ROUND ' + pad(G.bestRound, 2), bl, bb + f.big * 0.8 + 2, f.small, PAL.ramp[4]);
  drawButton(BTN.fire, { hot: blink(1.1) });
}
function drawOptions() {
  const f = ui();
  drawFrame(true);
  const p = panel(Math.min(W - 32, 380), 330);
  label('OPTIONS', W / 2, p.y + 22, f.mid + 2, PAL.ramp[6], 'center');
  const items = [
    ['NIGHT VISION', PAL.label, cyclePalette],
    ['SOUND', OPT.sound ? 'ON' : 'OFF', () => setSound(!OPT.sound)],
    ['FIRE BUTTON', OPT.leftHand ? 'LEFT HAND' : 'RIGHT HAND', () => { OPT.leftHand = !OPT.leftHand; saveOpt(); layoutButtons(); }],
    ['TAP ANYWHERE TO FIRE', OPT.tapFire ? 'ON' : 'OFF', () => { OPT.tapFire = !OPT.tapFire; saveOpt(); }],
    ['AIM SPEED', OPT.aim === 0.7 ? 'SLOW' : OPT.aim === 1.4 ? 'FAST' : 'NORMAL', () => { OPT.aim = OPT.aim === 0.7 ? 1 : OPT.aim === 1 ? 1.4 : 0.7; saveOpt(); }],
  ];
  let y = p.y + 72;
  for (const [k, v, fn] of items) {
    label(k, p.x + 22, y, f.small + 1, PAL.ramp[4]);
    label(v + ' ▸', p.x + p.w - 22, y, f.small + 1, PAL.ramp[6], 'right');
    rows.push({ x0: p.x, y0: y - 12, x1: p.x + p.w, y1: y + f.small + 12, onTap: fn });
    y += 40;
  }
  menuRow('BACK', p.y + p.h - 44, f.mid, () => setState('title'));
}
function drawHelp() {
  const f = ui();
  drawFrame(true);
  const p = panel(Math.min(W - 32, 400), 350);
  label('HOW TO PLAY', W / 2, p.y + 22, f.mid + 2, PAL.ramp[6], 'center');
  const lines = [
    'DRAG TO PAN THE SCOPE. TAP',
    'ANYWHERE TO SHOOT WHAT IS UNDER',
    'THE RETICLE. WAIT FOR THE STOP.',
    '',
    'RATS COME OUT OF THE HOLES AND',
    'GO FOR THE GRAIN. A RAT THAT',
    'CARRIES A SACK HOME STEALS IT.',
    'LOSE ALL 3 SACKS: GAME OVER.',
    '',
    'ZOOM FOR THE FAR ONES. STREAKS',
    'MULTIPLY YOUR SCORE. AMMO IS',
    'ISSUED EACH ROUND, SO AIM.',
  ];
  let y = p.y + 66;
  for (const l of lines) { if (l) label(l, W / 2, y, f.small, PAL.ramp[5], 'center'); y += l ? 20 : 9; }
  menuRow('BACK', p.y + p.h - 44, f.mid, () => setState('title'));
}
function drawIntro() {
  const f = ui();
  drawFrame(false);
  const k = Math.min(1, G.stateT * 4);
  ctx.save(); ctx.globalAlpha = k;
  text('ROUND ' + pad(G.round, 2), W / 2, H * 0.36, f.big * 1.5, FONT_DISPLAY, PAL.ramp[6], 'center', 'middle');
  label(pad(G.ratsTotal, 2) + ' RATS  ·  ' + pad(G.mag + G.reserve, 2) + ' ROUNDS OF AMMO', W / 2, H * 0.36 + f.big, f.small + 1, PAL.ramp[5], 'center');
  if (G.round === 1) label('THEY ARE AFTER THE GRAIN. STOP THEM.', W / 2, H * 0.36 + f.big + 24, f.small, PAL.ramp[4], 'center');
  if (blink(1)) label('TAP TO START', W / 2, H * 0.36 + f.big + 56, f.small, PAL.ramp[4], 'center');
  ctx.restore();
}
function drawClear() {
  const f = ui();
  drawFrame(false);
  const p = panel(Math.min(W - 32, 340), 250);
  text('ROUND ' + pad(G.round, 2) + ' CLEAR', W / 2, p.y + 40, f.big, FONT_DISPLAY, PAL.ramp[6], 'center', 'middle');
  const acc = G.roundShots ? Math.round(100 * G.roundHits / G.roundShots) : 0;
  const rowsTxt = [['HITS', pad(G.roundHits, 2) + ' / ' + pad(G.ratsTotal, 2)], ['ESCAPED', pad(G.ratsEscaped, 2)], ['ACCURACY', acc + '%'], ['AMMO BONUS', '+' + G.ammoBonus], ['ACCURACY BONUS', '+' + G.accBonus]];
  let y = p.y + 82;
  for (const [k, v] of rowsTxt) { label(k, p.x + 24, y, f.small + 1, PAL.ramp[4]); label(v, p.x + p.w - 24, y, f.small + 1, PAL.ramp[6], 'right'); y += 24; }
  if (blink(1)) label('TAP FOR ROUND ' + pad(G.round + 1, 2), W / 2, p.y + p.h - 28, f.small, PAL.ramp[4], 'center');
}
function drawPaused() {
  const f = ui();
  drawFrame(false);
  const p = panel(Math.min(W - 32, 320), 300);
  label('PAUSED', W / 2, p.y + 26, f.mid + 4, PAL.ramp[6], 'center');
  let y = p.y + 80;
  menuRow('RESUME', y, f.mid, togglePause); y += 42;
  menuRow('NIGHT VISION ▸ ' + PAL.label, y, f.mid - 2, cyclePalette, PAL.ramp[4]); y += 42;
  menuRow('SOUND ▸ ' + (OPT.sound ? 'ON' : 'OFF'), y, f.mid - 2, () => setSound(!OPT.sound), PAL.ramp[4]); y += 42;
  menuRow('RESTART', y, f.mid - 2, startGame, PAL.ramp[4]); y += 42;
  menuRow('QUIT TO TITLE', y, f.mid - 2, () => { rats.length = 0; setState('title'); }, PAL.ramp[4]);
}
function drawOver() {
  const f = ui();
  drawFrame(false);
  const p = panel(Math.min(W - 32, 360), 320);
  text('GAME OVER', W / 2, p.y + 44, f.big * 1.2, FONT_DISPLAY, PAL.ramp[6], 'center', 'middle');
  label(G.sacks <= 0 ? 'THE RATS GOT THE GRAIN' : 'STAND DOWN', W / 2, p.y + 78, f.small, PAL.warn, 'center');
  const acc = G.shots ? Math.round(100 * G.hits / G.shots) : 0;
  const rowsTxt = [['SCORE', pad(G.score, 7)], [G.newBest ? 'NEW BEST' : 'BEST', pad(G.best, 7)], ['ROUND REACHED', pad(G.round, 2)], ['RATS HIT', pad(G.hits, 2) + '  ·  ' + acc + '% ACC'], ['BEST STREAK', '×' + G.bestStreak]];
  let y = p.y + 112;
  for (const [k, v] of rowsTxt) { label(k, p.x + 24, y, f.small + 1, k === 'NEW BEST' && blink(0.6) ? PAL.warn : PAL.ramp[4]); label(v, p.x + p.w - 24, y, f.small + 1, PAL.ramp[6], 'right'); y += 24; }
  if (blink(1.1)) label('> PRESS FIRE TO RETRY', W / 2, p.y + p.h - 64, f.mid, PAL.ramp[6], 'center');
  menuRow('TITLE', p.y + p.h - 32, f.small + 1, () => { rats.length = 0; setState('title'); }, PAL.ramp[4]);
  drawButton(BTN.fire, { hot: blink(1.1) });
}
function drawBoot() {
  const t = G.bootT;
  ctx.fillStyle = PAL.ramp[0]; ctx.fillRect(0, 0, W, H);
  if (t < 0.55) {
    const k = Math.min(1, t / 0.3);
    const lw = W * k, lh = t < 0.3 ? 2 : 2 + (t - 0.3) / 0.25 * H;
    ctx.save(); ctx.shadowColor = PAL.ramp[5]; ctx.shadowBlur = 30;
    ctx.fillStyle = PAL.a(t < 0.3 ? 6 : 3, t < 0.3 ? 1 : 0.5); ctx.fillRect(W / 2 - lw / 2, H / 2 - lh / 2, lw, lh);
    ctx.restore();
  } else {
    drawWorld(CFG.sacks);
    ctx.fillStyle = PAL.a(0, 1 - (t - 0.55) / 0.6); ctx.fillRect(0, 0, W, H);
  }
  drawTubeOverlays(0.3);
  label('IMAGE INTENSIFIER  ·  WARMING UP', W / 2, H - SAFE.b - 40, ui().small, PAL.ramp[4], 'center');
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = PAL.ramp[0]; ctx.fillRect(0, 0, W, H);
  rows = [];
  if (G.state === 'boot') { drawBoot(); return; }
  drawWorld(G.sacks);
  drawFloats();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (G.agc > 0) { ctx.fillStyle = 'rgba(0,0,0,' + (G.agc * 0.4) + ')'; ctx.fillRect(0, 0, W, H); }
  const st = G.state;
  if (st === 'title') drawTitle();
  else if (st === 'options') drawOptions();
  else if (st === 'help') drawHelp();
  else if (st === 'intro') { drawReticle(); drawIntro(); }
  else if (st === 'play') { drawReticle(); drawPlayHud(); }
  else if (st === 'paused') { drawReticle(); drawPaused(); }
  else if (st === 'clear') drawClear();
  else if (st === 'over') drawOver();
  drawTubeOverlays(REDUCED ? 0.05 : (G.flash > 0.2 ? 0.2 : 0.1));
  if (G.flash > 0) { ctx.fillStyle = PAL.a(6, G.flash * 0.75); ctx.fillRect(0, 0, W, H); }
}

// ============================================================
// BOOT
// ============================================================
let last = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0;
  last = ts;
  update(dt);
  render();
}
function boot() {
  setPalette(OPT.palette);
  buildScan();
  resize();
  Audio.setMuted(!OPT.sound);
  G.spawnT = 1;
  requestAnimationFrame(frame);
}
// a small window for tests and tinkering from the console
window.__rh = { G, cam, rats, CFG, fire, reload, startGame, startRound, setState, spawnRat, hitTest, screenToWorld, worldToScreen, HOLES, GRAIN, COVER, Rat };

const fontsReady = (document.fonts && document.fonts.load)
  ? Promise.all([document.fonts.load("40px 'VT323'"), document.fonts.load("16px 'Share Tech Mono'")]).catch(() => {})
  : Promise.resolve();
fontsReady.then(() => {
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot();
});
/*SW*/if ('serviceWorker' in navigator && location.protocol === 'https:') window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
})();
</script>
